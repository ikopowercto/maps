<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Localisation - IKO Power</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    :root {
      --main-blue: #3b82f6;
      --text-dark: #1e1e1e;
      --gray-light: #f3f4f6;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--white);
      color: var(--text-dark);
      height: 100%;
      overflow: hidden; /* empêche le scroll vertical */
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      height: 100dvh;
      padding: 16px;
    }

    header {
      text-align: center;
      max-width: 100%;
      width: 100%;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    #logo {
      width: 160px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.7rem;
      margin: 0;
    }

    p.description {
      font-size: 0.95rem;
      color: #555;
      margin: 6px 0 16px 0;
      padding: 0 12px;
    }

    #map {
      flex-grow: 1;
      width: 100%;
      max-width: 1000px;
      border-radius: 10px;
      border: 2px solid var(--main-blue);
    }

    #coords {
      margin-top: 14px;
      padding: 10px 14px;
      font-size: 0.95rem;
      width: 90%;
      max-width: 400px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      text-align: center;
      flex-shrink: 0;
    }

    #btn {
      margin-top: 10px;
      padding: 10px 24px;
      font-size: 0.95rem;
      background-color: var(--main-blue);
      color: white;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    #btn:hover {
      background-color: #2563eb;
    }

    footer {
      font-size: 0.8rem;
      color: #999;
      margin-top: auto;
      padding: 8px;
      text-align: center;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.3rem;
      }

      #logo {
        width: 120px;
      }

      p.description {
        font-size: 0.85rem;
      }

      #coords {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- Logo + Titre -->
  <header>
    <img id="logo" src="https://ikopower.fr/wp-content/uploads/2021/11/iko-power_logo_turbine-hydroelectrique.png" alt="Logo IKO Power" />
    <h1>Choisissez votre position</h1>
    <p class="description">
      Cliquez sur la carte pour générer vos coordonnées géographiques.<br>
      Une fois copiées, collez-les dans le formulaire.
    </p>
  </header>

  <!-- Carte -->
  <div id="map"></div>

  <!-- Coordonnées -->
  <input type="text" id="coords" placeholder="Latitude, Longitude" readonly />
  <br />
  <button id="btn" onclick="copyCoords()">📋 Copier les coordonnées</button>

  <footer>
    &copy; 2025 IKO Power • Carte interactive client
  </footer>

  <!-- Leaflet.js -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([46.603354, 1.888334], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker;

    map.on('click', function (e) {
      const lat = e.latlng.lat.toFixed(6);
      const lng = e.latlng.lng.toFixed(6);
      const coords = lat + ', ' + lng;
      document.getElementById('coords').value = coords;

      if (marker) {
        map.removeLayer(marker);
      }
      marker = L.marker([lat, lng]).addTo(map);
    });

    function copyCoords() {
  const input = document.getElementById('coords');
  const value = input.value;

  if (!value) {
    alert("❗ Veuillez sélectionner un point sur la carte d'abord.");
    return;
  }

  // Méthode moderne, sans popup
  navigator.clipboard.writeText(value)
    .then(() => {
      alert("✅ Coordonnées copiées avec succès !");
    })
    .catch(err => {
      console.error("Erreur de copie :", err);
      alert("❌ La copie a échoué. Essayez manuellement.");
    });
}
  </script>
</body>
</html>
